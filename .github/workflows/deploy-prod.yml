name: Deploy (prod)

# emburden.org. The site is pre-built locally with
# `Rscript -e 'rmarkdown::render_site()'` and the resulting `_build/`
# directory is committed to the repo. This workflow just uploads that
# directory as a Pages artifact. Follows the "user commits + push +
# GitHub does the rest" model established for ericscheier.info.
#
# To update content: edit the .Rmd sources, rebuild locally
# (`cd emburden-site && Rscript -e 'rmarkdown::render_site()'`),
# commit both the source and the rebuilt `_build/` output, push to
# master. Pages deploys within ~1 min.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure _build exists
        run: |
          if [ ! -d _build ]; then
            echo "❌ _build/ not present — did you forget to run rmarkdown::render_site() before pushing?"
            exit 1
          fi

      - name: Write CNAME (prod)
        run: |
          echo 'emburden.org' > _build/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
