name: Deploy (prod)

# emburden.org. Mirrors the ericscheier.info deploy-prod pattern —
# builds the R Markdown site with `rmarkdown::render_site()`, then
# hands the artifact to Pages via deploy-pages@v4.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("rmarkdown","dplyr","ggplot2","sf","scales","viridis","patchwork","tibble","tidyr","readr","knitr","ggrepel","bslib"))'

      - name: Install emburden ecosystem R packages
        run: |
          Rscript -e 'remotes::install_github(c(
            "ericscheier/emburden",
            "ericscheier/emburdengeo",
            "ericscheier/emburdendata",
            "ericscheier/emburdenvis",
            "ericscheier/emburdenpub",
            "ericscheier/emburdensynth"
          ), upgrade = "never")'

      - name: Build site
        run: |
          Rscript -e 'rmarkdown::render_site(quiet = TRUE)'

      - name: Ensure CNAME
        run: |
          echo 'emburden.org' > _build/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
