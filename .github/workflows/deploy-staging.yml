name: Deploy (staging)

# staging.emburden.org. Pre-built _build/ is pushed from here to the
# staging companion repo (ericscheier/emburden-site-staging) via an
# ed25519 deploy key held as STAGING_DEPLOY_KEY. Follows the
# ericscheier.info staging-in-separate-repo pattern.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure _build exists
        run: |
          if [ ! -d _build ]; then
            echo "❌ _build/ not present — run rmarkdown::render_site() before pushing to staging"
            exit 1
          fi

      - name: Keep staging out of search results + set CNAME
        run: |
          printf 'User-agent: *\nDisallow: /\n' > _build/robots.txt
          echo 'staging.emburden.org' > _build/CNAME

      - name: Publish to the staging repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.STAGING_DEPLOY_KEY }}
          external_repository: ericscheier/emburden-site-staging
          publish_branch: main
          publish_dir: ./_build
          commit_message: "staging: ${{ github.sha }}"
