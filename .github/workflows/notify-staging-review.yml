name: Notify staging review

# Fires after a successful staging deploy. Runs a small Python
# script that creates or updates a single "Review staging.emburden.org"
# task in the user's todojor Asana project so review prompts don't
# pile up. See .github/scripts/asana_staging_review.py for the loop.

on:
  workflow_run:
    workflows: ["Deploy (staging)"]
    types: [completed]
    branches: [staging]
  workflow_dispatch:

jobs:
  ping-review:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      ASANA_TOKEN:           ${{ secrets.ASANA_TOKEN }}
      ASANA_WORKSPACE_GID:   "1337952238460"
      ASANA_PROJECT_GID:     "1213974477039300"
      ASANA_ASSIGNEE_GID:    "1337952238455"
      STAGING_URL:           "https://staging.emburden.org"
      SITE_KEY:              "emburden-site-staging-review"
      REPO_SLUG:             ${{ github.repository }}
      REVIEW_SHA:            ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install --quiet requests

      - name: Run staging-review loop
        run: python .github/scripts/asana_staging_review.py
