name: PR checks

# Runs on PRs into staging or master. Verifies the built site is
# present and internal links resolve.
on:
  pull_request:
    branches: [staging, master]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: _build/ present + non-empty
        run: |
          if [ ! -d _build ] || [ -z "$(ls -A _build 2>/dev/null)" ]; then
            echo "❌ _build/ is missing or empty. Run rmarkdown::render_site() locally + commit before opening a PR."
            exit 1
          fi

      - name: Internal-link check
        run: |
          sudo apt-get install -y linkchecker
          linkchecker --check-extern=false --recursion-level=2 _build/index.html || \
            (echo "❌ link check failed"; exit 1)
